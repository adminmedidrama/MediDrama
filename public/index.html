  <!-- FIREBASE CONFIG & APPLICATION SCRIPT -->
  <script>
    // Konfigurasi Kredensial Firebase Asli MediDrama
    const firebaseConfig = {
      apiKey: "AIzaSyCQj4SI_Z9ZptP4UjPga2d_mV0z211CV7k",
      authDomain: "medidrama-bd5a2.firebaseapp.com",
      projectId: "medidrama-bd5a2",
      storageBucket: "medidrama-bd5a2.firebasestorage.app",
      messagingSenderId: "378411394876",
      appId: "1:378411394876:web:198f7d801bbb0f7e5e2039",
      measurementId: "G-77E0XGBY6D"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    if (typeof firebase.analytics === 'function') {
      firebase.analytics();
    }

    // Variabel Global
    let currentUser = null;
    let authMode = 'login';
    let dramaData = [];
    let currentSlide = 0;
    let heroItems = [];

    // Pantau Status Autentikasi Firebase
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const userDocRef = db.collection('users').doc(user.uid);
        const doc = await userDocRef.get();

        const isFounderEmail = user.email.toLowerCase() === 'adminmedidrama@gmail.com';

        if (!doc.exists) {
          const initialData = {
            name: user.displayName || user.email.split('@')[0],
            email: user.email,
            role: isFounderEmail ? 'Founder' : 'Penonton',
            coins: isFounderEmail ? 9999 : 100,
            photoURL: user.photoURL || '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          await userDocRef.set(initialData);
          updateUIWithUserData(initialData);
        } else {
          const data = doc.data();
          if (isFounderEmail && data.role !== 'Founder') {
            await userDocRef.update({ role: 'Founder' });
            data.role = 'Founder';
          }
          updateUIWithUserData(data);
        }
      } else {
        currentUser = null;
        resetUIToGuest();
      }
    });

    function updateUIWithUserData(data) {
      document.getElementById('profileNameInput').value = data.name || 'Pengguna';
      document.getElementById('profileEmail').innerText = data.email;
      document.getElementById('profileCoins').innerText = data.coins || 0;
      document.getElementById('userRoleBadge').innerText = data.role;
      document.getElementById('navAuthLabel').innerText = (data.name || 'User').split(' ')[0];
      document.getElementById('authActionBtn').innerText = 'Keluar';
      document.getElementById('authActionBtn').onclick = handleSignOut;

      if (data.photoURL) {
        document.getElementById('profileImagePreview').src = data.photoURL;
        document.getElementById('navAvatar').src = data.photoURL;
      }

      if (data.role === 'Founder' || data.email.toLowerCase() === 'adminmedidrama@gmail.com') {
        document.getElementById('adminBtn').classList.remove('hidden');
      } else {
        document.getElementById('adminBtn').classList.add('hidden');
      }
    }

    function resetUIToGuest() {
      document.getElementById('profileNameInput').value = 'Tamu';
      document.getElementById('profileEmail').innerText = 'Belum masuk';
      document.getElementById('profileCoins').innerText = '0';
      document.getElementById('userRoleBadge').innerText = 'Tamu';
      document.getElementById('userRoleBadge').className = 'text-[10px] px-2 py-0.5 rounded bg-gray-800 text-gray-300 font-bold';
      document.getElementById('navAuthLabel').innerText = 'Masuk';
      document.getElementById('authActionBtn').innerText = 'Masuk / Daftar';
      document.getElementById('authActionBtn').onclick = openAuthModal;
      document.getElementById('adminBtn').classList.add('hidden');
      document.getElementById('profileImagePreview').src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100";
      document.getElementById('navAvatar').src = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100";
    }

    // Inisialisasi Tampilan & Data Firestore
    window.addEventListener('DOMContentLoaded', () => {
      loadDramasFromFirestore();
      renderFavorites();
      setInterval(nextSlide, 4500);
    });

    // Ambil Data Serial dari Koleksi Firestore
    function loadDramasFromFirestore() {
      db.collection('dramas').onSnapshot((snapshot) => {
        if (!snapshot.empty) {
          dramaData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        } else {
          // Data cadangan jika Firestore masih kosong
          dramaData = [

    // Kompresi Foto Profil WebP (<25 KB) & Upload ke Firestore
    function compressAndUploadAvatar(event) {
      if (!currentUser) return alert('Silakan login terlebih dahulu.');
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 300;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedWebP = canvas.toDataURL('image/webp', 0.7);

          try {
            await db.collection('users').doc(currentUser.uid).update({
              photoURL: compressedWebP
            });
            document.getElementById('profileImagePreview').src = compressedWebP;
            document.getElementById('navAvatar').src = compressedWebP;
            alert('Foto profil berhasil dikompresi (<25 KB) & disimpan!');
          } catch (err) {
            alert('Gagal menyimpan foto: ' + err.message);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

          await db.collection('users').doc(cred.user.uid).set({

          await auth.signInWithEmailAndPassword(email, pass);

        closeAuthModal();

        alert('Gagal autentikasi: ' + err.message);

    // Slider Otomatis & Katalog
    function renderHeroSlider() {
      heroItems = dramaData.slice(0, 4);
      const track = document.getElementById('heroTrack');
      const dots = document.getElementById('slideDots');
      track.innerHTML = '';
      dots.innerHTML = '';

      heroItems.forEach((item, idx) => {
        track.innerHTML += `
          <div class="relative w-full flex-shrink-0 h-full">
            <img src="${item.cover}" class="w-full h-full object-cover brightness-75" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#0B0D14] via-[#0B0D14]/40 to-transparent"></div>

              <h2 class="text-lg md:text-2xl font-black text-white leading-tight">${item.title}</h2>
              <div class="flex items-center gap-2 pt-1">
                <button onclick="playDirect('${item.video}')" class="bg-gradient-to-r from-red-600 to-amber-500 text-white font-bold text-xs px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-lg">

                </button>
                <button onclick="toggleFavorite('${item.id}')" class="bg-white/10 backdrop-blur-md text-white text-xs px-3 py-2 rounded-xl border border-white/20">
                  <i class="fa-solid fa-heart"></i>
                </button>
              </div>
            </div>
          </div>
        `;

        dots.innerHTML += `
          <div class="w-2 h-2 rounded-full transition-all duration-300 ${idx === 0 ? 'bg-red-500 w-5' : 'bg-gray-600'}"></div>
        `;
      });
    }

    function updateSlider() {
      const track = document.getElementById('heroTrack');
      if (!track) return;
      track.style.transform = `translateX(-${currentSlide * 100}%)`;
      const dots = document.getElementById('slideDots').children;
      for (let i = 0; i < dots.length; i++) {
        dots[i].className = i === currentSlide ? 'w-5 h-2 rounded-full bg-red-500 transition-all duration-300' : 'w-2 h-2 rounded-full bg-gray-600 transition-all duration-300';
      }
    }

    function nextSlide() {
      if (heroItems.length === 0) return;
      currentSlide = (currentSlide + 1) % heroItems.length;
      updateSlider();
    }

    function prevSlide() {
      if (heroItems.length === 0) return;
      currentSlide = (currentSlide - 1 + heroItems.length) % heroItems.length;
      updateSlider();
    }

    function toggleFavorite(id) {
      let favs = JSON.parse(localStorage.getItem('user_favs')) || [];
      if (favs.includes(id)) {
        favs = favs.filter(item => item !== id);
      } else {
        favs.push(id);
      }
      localStorage.setItem('user_favs', JSON.stringify(favs));
      renderFavorites();
    }

    function renderFavorites() {
      const favs = JSON.parse(localStorage.getItem('user_favs')) || [];
      const favList = document.getElementById('favoriteList');
      const filtered = dramaData.filter(d => favs.includes(d.id));
      if (filtered.length === 0) {
        favList.innerHTML = '<p class="text-xs text-gray-500 col-span-2 py-4 text-center">Belum ada serial favorit yang disukai.</p>';
        return;

      favList.innerHTML = filtered.map(d => `

    }
